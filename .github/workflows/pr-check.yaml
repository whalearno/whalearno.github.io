# Pull Request 建置檢查：只建置、不發布。
# 檢查通過（綠色勾勾）再合併，合併後由 hugo.yaml 發布。
name: PR build check
env:
  HUGO_VERSION: 0.168.0
  TZ: Asia/Taipei
on:
  pull_request:
    branches:
      - main
permissions:
  contents: read
defaults:
  run:
    shell: bash
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install Hugo
        run: |
          mkdir -p "${HOME}/.local/hugo"
          curl -sfL --output-dir "${{ runner.temp }}" -O "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.tar.gz"
          tar -C "${HOME}/.local/hugo" -xf "${{ runner.temp }}/hugo_extended_${HUGO_VERSION}_linux-amd64.tar.gz"
          echo "${HOME}/.local/hugo" >> "${GITHUB_PATH}"

      - name: Check posts (format only; sensitive-term check runs locally)
        run: python3 tools/check_post.py --all

      - name: Build
        run: |
          hugo version
          hugo build --gc --minify
