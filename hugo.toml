      description = "Research Notes & Perspectives"
      [languages.en.params.homeInfoParams]
        Title = "Research Notes & Perspectives"
        Content = "Observations, derivations and reflections on mathematics, physics and AI."
    [[languages.en.menus.main]]
      name = "Notes"
      pageRef = "/notes"
      weight = 10
    [[languages.en.menus.main]]
      name = "Essays"
      pageRef = "/essays"
      weight = 20
    [[languages.en.menus.main]]
      name = "Publications"
      pageRef = "/publications"
      weight = 30
    [[languages.en.menus.main]]
      name = "Tags"
      pageRef = "/tags"
      weight = 40
    [[languages.en.menus.main]]
      name = "Search"
      pageRef = "/search"
      weight = 50
    [[languages.en.menus.main]]
